<!DOCTYPE html>
<html>

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Login</title>

    <link rel="stylesheet"
          href="/static/style.css">

</head>

<body>

<header>

    <div class="logo">
        📝 My Blog
    </div>

    <nav>

        <a href="/">
            Home
        </a>

        <a href="/register.html">
            Register
        </a>

    </nav>

</header>


<main>

    <div class="form-container">

        <h1>
            Login
        </h1>


        <form id="loginForm">

            <label>
                Username
            </label>

            <input
                type="text"
                id="username"
                required>


            <label>
                Password
            </label>

            <input
                type="password"
                id="password"
                required>


            <button type="submit">
                Login
            </button>

        </form>


        <p id="message"></p>


        <p>
            Don't have an account?

            <a href="/register.html">
                Register
            </a>
        </p>

    </div>

</main>


<script>

document
.getElementById("loginForm")
.addEventListener("submit", async function(event) {

    event.preventDefault();


    const username =
        document.getElementById("username").value;

    const password =
        document.getElementById("password").value;


    const response =
        await fetch(
            "/api/login",
            {
                method: "POST",

                headers: {
                    "Content-Type":
                        "application/json"
                },

                body: JSON.stringify({
                    username: username,
                    password: password
                })
            }
        );


    const data =
        await response.json();


    if (response.ok) {

        localStorage.setItem(
            "token",
            data.token
        );

        localStorage.setItem(
            "username",
            data.username
        );


        window.location =
            "/";

    } else {

        document
        .getElementById("message")
        .innerText =
            data.error;

    }

});

</script>

</body>

</html>
