<!DOCTYPE html>
<html>

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Create Post</title>

    <link rel="stylesheet"
          href="/static/style.css">

</head>

<body>

<header>

    <div class="logo">
        📝 My Blog
    </div>

    <nav>

        <a href="/">
            Home
        </a>

        <a href="/login.html">
            Login
        </a>

    </nav>

</header>


<main>

    <div class="form-container">

        <h1>
            Create Blog Post
        </h1>


        <form id="postForm">

            <label>
                Title
            </label>

            <input
                type="text"
                id="title"
                placeholder="Enter post title"
                required>


            <label>
                Content
            </label>

            <textarea
                id="content"
                placeholder="Write your blog..."
                required></textarea>


            <button type="submit">
                Publish Post
            </button>

        </form>


        <p id="message"></p>

    </div>

</main>


<script>

document
.getElementById("postForm")
.addEventListener("submit", async function(event) {

    event.preventDefault();


    const token =
        localStorage.getItem("token");


    if (!token) {

        alert(
            "Please login first"
        );

        window.location =
            "/login.html";

        return;

    }


    const title =
        document.getElementById("title").value;

    const content =
        document.getElementById("content").value;


    const response =
        await fetch(
            "/api/posts",
            {
                method: "POST",

                headers: {

                    "Content-Type":
                        "application/json",

                    "Authorization":
                        "Bearer " + token
                },

                body: JSON.stringify({

                    title: title,

                    content: content

                })
            }
        );


    const data =
        await response.json();


    if (response.ok) {

        alert(
            "Post created successfully!"
        );

        window.location =
            "/";

    } else {

        document
        .getElementById("message")
        .innerText =
            data.error;

    }

});

</script>

</body>

</html>
